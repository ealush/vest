name: Integration

on:
  push:
    branches:
      - release
      - release-keep-version
      - integration
      - integration-*
      - next
      - next-*
      - nightly
      - latest
  pull_request:

permissions:
  contents: write
  id-token: write # Required for OIDC npm publishing

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NIGHTLY_BRANCH: nightly
      RELEASE_BRANCH: release
      RELEASE_KEEP_VERSION_BRANCH: release-keep-version
      INTEGRATION_BRANCH: integration
      NEXT_BRANCH: next
      STABLE_BRANCH: stable
      LATEST_BRANCH: latest
      PUBLIC_REPO_TOKEN: ${{secrets.GH_TOKEN}}
      EMAIL_ADDRESS: ${{secrets.EMAIL_ADDRESS}}
      GIT_NAME: ${{secrets.GIT_NAME}}
    strategy:
      matrix:
        node-version: [24]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          registry-url: 'https://registry.npmjs.org'
          always-auth: false
      - name: Install
        run: yarn install --immutable
      - name: Ensure deps are deduped
        run: yarn dedupe --check
      - name: Build
        run: yarn build
      - name: Test
        run: yarn test
      - name: Test executable documentation and demos
        run: yarn docs:examples:test
      - name: Test canonical production example
        run: yarn example:production:test
      - name: Typecheck canonical production example
        run: yarn example:production:typecheck
      - name: Build canonical production example
        run: yarn example:production:build
      - name: Test ecosystem integrations
        run: yarn integrations:test
      - name: Typecheck ecosystem integrations
        run: yarn integrations:typecheck
      - name: Build ecosystem demos
        run: yarn integrations:build
      - name: Verify generated integration docs
        run: |
          yarn integrations:docs
          git diff --exit-code
      - name: Format
        run: yarn format
      - name: Lint
        run: yarn lint
      - name: Release
        run: yarn release
      - name: Run benchmarks
        if: github.event_name != 'pull_request'
        run: npx tsx vx/scripts/benchmark-reporter.ts --update
      - name: Commit Benchmark Results
        if: github.event_name != 'pull_request'
        run: |
          git config --global user.name "${{ secrets.GIT_NAME }}"
          git config --global --replace-all user.email "${{ secrets.EMAIL_ADDRESS }}"
          git add benchmark-results.md
          git commit -m "chore(benchmark): update benchmark results" || echo "No changes to commit"
          output=$(git push origin HEAD:${GITHUB_REF_NAME} 2>&1) || rc=$?
          if [ -n "$rc" ]; then
            if echo "$output" | grep -iq "everything up-to-date"; then
              echo "No changes to push"
            else
              echo "$output"
              exit $rc
            fi
          fi
