name: Integration

on:
  push:
    branches:
      - release
      - release-keep-version
      - integration
      - integration-*
      - next
      - next-*
      - nightly
      - latest
  pull_request:

permissions:
  contents: write
  id-token: write # Required for OIDC npm publishing

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NIGHTLY_BRANCH: nightly
      RELEASE_BRANCH: release
      RELEASE_KEEP_VERSION_BRANCH: release-keep-version
      INTEGRATION_BRANCH: integration
      NEXT_BRANCH: next
      STABLE_BRANCH: stable
      LATEST_BRANCH: latest
      PUBLIC_REPO_TOKEN: ${{secrets.GH_TOKEN}}
      EMAIL_ADDRESS: ${{secrets.EMAIL_ADDRESS}}
      GIT_NAME: ${{secrets.GIT_NAME}}
    strategy:
      matrix:
        node-version: [24]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          registry-url: 'https://registry.npmjs.org'
          always-auth: false
      - name: Install
        run: yarn install --immutable
      - name: Ensure deps are deduped
        run: yarn dedupe --check
      - name: Build
        run: yarn build
      - name: Test
        run: yarn test
      - name: Format
        run: yarn format
      - name: Lint
        run: yarn lint
      - name: Release
        run: yarn release
      - name: Run benchmarks
        run: npx tsx vx/scripts/benchmark-reporter.ts --update
      - name: Commit Benchmark Results
        run: |
          git config --global user.name "${{ secrets.GIT_NAME }}"
          git config --global --replace-all user.email "${{ secrets.EMAIL_ADDRESS }}"
          git add benchmark-results.md
          git commit -m "chore(benchmark): update benchmark results [skip ci]" || echo "No changes to commit"
          git push origin HEAD:${GITHUB_REF_NAME} || echo "No changes to push"
